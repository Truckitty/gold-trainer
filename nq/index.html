<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NQ K&#x7EBF;&#x8BAD;&#x7EC3;">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>&#x7EB3;&#x6307; NQ K&#x7EBF;&#x8BAD;&#x7EC3;&#x5668;</title>
<style>
/* Design: Precision Quant Terminal x Swiss Architectural Grid.
   Obsidian slate surfaces, electric cyan NQ identity accent, emerald/crimson strictly reserved for market direction & P&L.
   High-ergonomics one-tap controls for both desktop and iPhone. */
:root {
  --bg:#0b0f17; --panel:#111722; --card:#17202e; --card2:#1e293b; --line:#222e42; --line-hi:#33445e;
  --fg:#edf2f7; --fg2:#c6d0df; --muted:#8190a7; --ink:#071019;
  --acc:#38bdf8; --acc-hi:#7dd3fc; --acc-dim:rgba(56,189,248,.14); --acc-ink:#06131f;
  --amber:#f59e0b; --amber-dim:rgba(245,158,11,.15);
  --up:#10b981; --up-dim:rgba(16,185,129,.15);
  --down:#f43f5e; --down-dim:rgba(244,63,94,.15);
  --r:6px; --r-lg:10px;
  --mono:"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
* { box-sizing:border-box; }
html, body {
  margin:0; height:100%; background:var(--bg); color:var(--fg); color-scheme:dark;
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
}
body {
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font:inherit; touch-action:manipulation; cursor:pointer; }
button:disabled { cursor:default; opacity:.38; }
input, select { color-scheme:dark; font:inherit; }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.good { color:var(--up); } .bad { color:var(--down); } .warn-c { color:var(--amber); } .acc-c { color:var(--acc); }

/* Core interactive buttons */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--line-hi); background:var(--card); color:var(--fg);
  border-radius:var(--r); font-weight:600; padding:9px 14px;
  transition:background .14s ease, border-color .14s ease, transform .08s ease, filter .14s ease;
}
.btn:not(:disabled):hover { background:var(--card2); border-color:#475c7d; }
.btn:not(:disabled):active { transform:translateY(1px); }
.btn.c-green { background:var(--up); border-color:transparent; color:#041a13; font-weight:800; }
.btn.c-green:not(:disabled):hover { filter:brightness(1.09); background:var(--up); }
.btn.c-red { background:var(--down); border-color:transparent; color:#fff; font-weight:800; }
.btn.c-red:not(:disabled):hover { filter:brightness(1.09); background:var(--down); }
.btn.c-open, .btn.c-acc { background:var(--acc); border-color:transparent; color:var(--acc-ink); font-weight:800; }
.btn.c-open:not(:disabled):hover, .btn.c-acc:not(:disabled):hover { filter:brightness(1.08); background:var(--acc); }
.btn.c-fixed, .btn.c-white { background:var(--fg); border-color:transparent; color:var(--ink); font-weight:800; }
.btn.c-fixed:not(:disabled):hover, .btn.c-white:not(:disabled):hover { filter:brightness(.93); background:var(--fg); }
.btn.c-ink { background:var(--ink); border-color:rgba(255,255,255,.12); color:#fff; font-weight:800; }
.btn.c-ink:not(:disabled):hover { background:#111d2c; }
.btn.c-ghost { background:transparent; border-color:var(--line-hi); color:var(--fg); }
.btn.c-ghost:not(:disabled):hover { background:var(--card); }
.btn.c-danger { background:var(--down-dim); border-color:rgba(244,63,94,.45); color:#fda4af; }
.btn.c-danger:not(:disabled):hover { background:var(--down); color:#fff; border-color:transparent; }

/* Top command strip */
#tfbar {
  display:flex; align-items:center; gap:2px; padding:5px 8px;
  background:var(--panel); border-bottom:1px solid var(--line);
  overflow-x:auto; scrollbar-width:none; flex:0 0 auto;
}
#tfbar::-webkit-scrollbar { display:none; }
#tfbar .sep { width:1px; height:16px; background:var(--line); margin:0 4px; flex:0 0 auto; }
#tfbar .grow { flex:1 1 auto; min-width:4px; }
#tfbar button {
  border:1px solid transparent; background:transparent; color:var(--fg2);
  border-radius:var(--r); padding:4px 7px; font-size:12px; white-space:nowrap;
  flex:0 0 auto; font-weight:600; transition:all .12s ease;
}
#tfbar button:hover { background:var(--card); color:var(--fg); }
#tfbar button.tfbtn.on { background:var(--acc-dim); color:var(--acc); border-color:rgba(56,189,248,.35); font-weight:700; }
#tfbar button.tog { color:var(--muted); font-size:12px; padding:5px 7px; }
#tfbar button.tog.on { color:var(--fg); background:var(--card); border-color:var(--line-hi); }
#tfbar .mode {
  display:inline-flex; align-items:center; gap:5px; font-weight:800; font-size:12px;
  padding:5px 10px; border-radius:var(--r); margin-right:4px;
}
#tfbar .mode svg { width:11px; height:11px; }
#tfbar .mode.fixed { background:var(--fg); color:var(--ink); }
#tfbar .mode.open { background:var(--acc); color:var(--acc-ink); }
#tfbar .symbtn {
  font-family:var(--mono); font-weight:800; font-size:12.5px; color:var(--fg);
  background:var(--card); border:1px solid var(--line-hi); padding:4px 9px; margin-right:4px;
}
#tfbar .symbtn small { color:var(--acc); font-weight:700; margin-left:4px; font-size:11px; }
#tfbar .swlink { display:inline-flex; align-items:center; gap:4px; text-decoration:none; font-size:11.5px; font-weight:800; color:#fbbf24; background:rgba(245,158,11,.13); border:1px solid rgba(245,158,11,.36); border-radius:var(--r); padding:4px 8px; margin-right:5px; white-space:nowrap; flex:0 0 auto; transition:all .14s ease; }
#tfbar .swlink:hover { background:rgba(245,158,11,.24); border-color:#fbbf24; color:#fef08a; }
.pf-bar a.sw-gc { display:inline-flex; align-items:center; gap:5px; text-decoration:none; padding:7px 12px; font-size:12.5px; font-weight:800; border-radius:var(--r); color:#fde68a; background:rgba(245,158,11,.14); border:1px solid rgba(245,158,11,.4); transition:all .14s ease; }
.pf-bar a.sw-gc:hover { background:rgba(245,158,11,.24); color:#fff; border-color:#fbbf24; }
.pf-bar a.sw-hub { display:inline-flex; align-items:center; text-decoration:none; padding:7px 11px; font-size:12.5px; font-weight:700; border-radius:var(--r); color:var(--fg2); background:transparent; border:1px solid var(--line-hi); transition:all .14s ease; }
.pf-bar a.sw-hub:hover { background:var(--card); color:var(--fg); }
#tfbar .repbtn { background:var(--card); border-color:var(--line); color:var(--fg); padding:5px 9px; }
#tfbar .repbtn:hover { border-color:var(--line-hi); background:var(--card2); }
#tfbar .repbtn.playing { background:var(--acc-dim); border-color:var(--acc); color:var(--acc); }
#tfbar #iSpd { font-family:var(--mono); color:var(--acc); background:var(--acc-dim); border-color:rgba(56,189,248,.28); padding:5px 8px; }
#nNew { font-weight:800 !important; border-radius:var(--r) !important; padding:5px 12px !important; }
#nNew.skipq { background:var(--amber) !important; color:#1c1102 !important; border-color:transparent !important; }
#nNew.nextq { background:var(--acc) !important; color:var(--acc-ink) !important; border-color:transparent !important; }
#nRound { border:1px solid var(--line-hi) !important; background:var(--card) !important; padding:5px 9px !important; }
#nExit { background:var(--down-dim) !important; border:1px solid rgba(244,63,94,.4) !important; color:#fda4af !important; font-weight:700 !important; padding:5px 10px !important; }
#nExit:hover { background:var(--down) !important; color:#fff !important; border-color:transparent !important; }

/* Live telemetry ribbon */
#hdr {
  padding:5px 12px; background:#0e141f; border-bottom:1px solid var(--line);
  font-size:12px; line-height:1.45; flex:0 0 auto;
}
#hdr .row { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; }
#hdr .muted { color:var(--muted); }
.pill {
  display:inline-flex; align-items:center; gap:4px; padding:1px 7px; border-radius:4px;
  font-size:11px; font-weight:700; background:var(--card); color:var(--fg2); border:1px solid var(--line);
}
.pill.s-asia { color:#f472b6; border-color:rgba(244,114,182,.35); background:rgba(244,114,182,.1); }
.pill.s-london { color:#22d3ee; border-color:rgba(34,211,238,.35); background:rgba(34,211,238,.1); }
.pill.s-ny { color:#fb923c; border-color:rgba(251,146,60,.35); background:rgba(251,146,60,.1); }
.pill.s-late { color:var(--muted); }
.pill.hot { color:#fb923c; border-color:rgba(251,146,60,.4); background:rgba(251,146,60,.12); }
.pill.cold { color:#60a5fa; border-color:rgba(96,165,250,.35); background:rgba(96,165,250,.1); }
#hPrice { font-family:var(--mono); font-weight:800; font-size:13px; color:var(--fg); }
#hClock, #hE, #hAcct, #pos { font-variant-numeric:tabular-nums; }
#hAcct, #pos { font-weight:700; }

/* Main workspace */
#main { flex:1 1 auto; display:flex; min-height:0; }
#chartWrap {
  position:relative; flex:1 1 auto; min-width:0; min-height:200px;
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
}
#chartWrap.picking { cursor:crosshair !important; box-shadow:inset 0 0 0 2px var(--acc); }
#tfbar, #ctl, #nav, #tags, #hdr, #intro { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
#chart { position:absolute; inset:0; }

/* Chart Click-to-Order floating banner */
#pickBanner {
  position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:12;
  display:none; align-items:center; gap:10px; padding:7px 12px; border-radius:999px;
  background:rgba(12,18,28,.94); border:1px solid var(--acc); color:var(--fg);
  font-size:12.5px; font-weight:600; box-shadow:0 8px 26px rgba(0,0,0,.55);
  backdrop-filter:blur(8px); white-space:nowrap; max-width:94%;
}
#pickBanner .dot-pulse { width:8px; height:8px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 4px var(--acc-dim); }
#pickBanner button { border:0; background:var(--card2); color:var(--fg); border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:700; }

/* Toast & context menu */
#toast {
  position:fixed; left:50%; top:calc(92px + env(safe-area-inset-top)); transform:translateX(-50%);
  background:rgba(23,32,46,.95); color:var(--fg); border:1px solid var(--line-hi);
  padding:6px 14px; border-radius:8px; font-size:12.5px; font-weight:600;
  display:none; z-index:65; max-width:min(90vw, 560px); text-align:center; pointer-events:none;
  box-shadow:0 10px 26px rgba(0,0,0,.5); backdrop-filter:blur(6px);
}
#ctx {
  position:absolute; display:none; z-index:15; background:var(--card); border:1px solid var(--line-hi);
  border-radius:8px; padding:5px; min-width:236px; box-shadow:0 14px 36px rgba(0,0,0,.6);
}
#ctx button { display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--fg); padding:9px 11px; font-size:13px; font-weight:600; border-radius:5px; }
#ctx button:hover { background:var(--card2); }
#ctx .b { color:var(--up); } #ctx .s { color:var(--down); } #ctx .ax { color:var(--fg2); }
#ctx hr { border:0; border-top:1px solid var(--line); margin:4px 6px; }
#ctx .cap { font-size:10.5px; letter-spacing:.12em; color:var(--muted); padding:4px 11px 2px; font-weight:700; text-transform:uppercase; }

/* Desktop Right Order & Risk Dock */
#side {
  width:316px; flex:0 0 316px; border-left:1px solid var(--line); background:var(--panel);
  overflow-y:auto; display:none; font-size:12.5px;
}
.sec { padding:9px 12px; border-bottom:1px solid var(--line); }
.sec.pos-active { background:linear-gradient(180deg, rgba(56,189,248,.07), transparent 85%); border-left:3px solid var(--acc); }
.sec h5 {
  margin:0 0 6px; font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.14em;
  display:flex; justify-content:space-between; align-items:center; text-transform:uppercase;
}
.sec h5 button { border:0; background:transparent; color:var(--acc); font-size:11.5px; padding:0; font-weight:700; letter-spacing:0; }
.sec h5 button:hover { text-decoration:underline; }
.big { font-family:var(--mono); font-size:24px; font-weight:800; margin:1px 0 6px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.05; }
.kvgrid { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:6px; }
.kvbox { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:4px 7px; }
.kvbox span { display:block; font-size:10px; color:var(--muted); }
.kvbox strong { display:block; font-family:var(--mono); font-size:12px; margin-top:1px; font-variant-numeric:tabular-nums; }
.kv { display:flex; justify-content:space-between; padding:2px 0; font-variant-numeric:tabular-nums; }
.kv span:first-child { color:var(--muted); }

/* Interactive Order Ticket */
.seg { display:flex; padding:2px; gap:2px; margin:0 0 7px; background:var(--bg); border:1px solid var(--line); border-radius:var(--r); }
.seg button { flex:1; min-height:28px; border:0; background:transparent; color:var(--muted); font-weight:700; font-size:12px; border-radius:4px; }
.seg button.on { background:var(--card2); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.3); }
.field-row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:5px 0 3px; }
.field-row label { font-size:11.5px; color:var(--fg2); font-weight:600; }
.field-row input {
  width:108px; font-family:var(--mono); font-size:13px; font-weight:700; padding:4px 8px;
  border:1px solid var(--line-hi); border-radius:var(--r); background:var(--bg); color:var(--fg); text-align:right;
}
.field-row input:focus { outline:none; border-color:var(--acc); }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin:3px 0 6px; }
.chips button {
  flex:1 1 auto; min-width:36px; border:1px solid var(--line-hi); background:var(--bg); color:var(--fg2);
  border-radius:4px; padding:3px 5px; font-size:11px; font-weight:700; font-family:var(--mono);
}
.chips button:hover { background:var(--card2); color:var(--fg); }
.chips button.on { background:var(--acc-dim); border-color:var(--acc); color:var(--acc); }
.riskbox {
  background:var(--bg); border:1px solid var(--line); border-radius:var(--r);
  padding:6px 8px; margin:6px 0 8px; font-size:11px; line-height:1.45; font-variant-numeric:tabular-nums;
}
.riskbox.danger { border-color:rgba(244,63,94,.6); background:var(--down-dim); }
.riskbox .rline { display:flex; justify-content:space-between; gap:6px; }
.pickbtn { width:100%; margin:0 0 6px; padding:6px 10px; font-size:12px; }
.pickbtn.on { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:800; }
.bs { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:6px; }
.bs button { min-height:48px; font-size:14px; line-height:1.15; padding:5px 4px; flex-direction:column; gap:2px; }
.bs button small { display:block; font-family:var(--mono); font-weight:700; font-size:11px; opacity:.92; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:6px; }
.row2 button { min-height:32px; font-size:12px; padding:4px; }
.hint { color:var(--muted); font-size:11.5px; margin:2px 0 4px; line-height:1.45; }

/* Tools & tags chips */
.tools { display:flex; flex-wrap:wrap; gap:5px; }
.tools button {
  border:1px solid var(--line-hi); background:var(--bg); color:var(--fg2);
  border-radius:var(--r); padding:5px 9px; font-size:12px; font-weight:600; white-space:nowrap;
}
.tools button:hover { background:var(--card2); color:var(--fg); }
.tools button.on { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:800; }
.tools button.ff { background:var(--card); border-color:var(--line-hi); color:var(--fg); font-weight:700; }
.tools button.ff.primary { background:var(--acc-dim); border-color:rgba(56,189,248,.45); color:var(--acc); }
.tools button.ff.danger { background:var(--down-dim); border-color:rgba(244,63,94,.45); color:#fda4af; }
.tools button.up:not(:disabled) { border-color:var(--up); color:var(--up); background:var(--up-dim); }
.tools .divider { width:100%; height:1px; background:var(--line); margin:4px 0; }

/* Mobile bottom docks */
#tags {
  display:none; gap:6px; padding:6px 8px; overflow-x:auto; scrollbar-width:none;
  border-top:1px solid var(--line); background:var(--panel); flex-wrap:nowrap; flex:0 0 auto;
}
#tags::-webkit-scrollbar { display:none; }
#tags button { flex:0 0 auto; }
#tags .lab { color:var(--muted); font-size:11.5px; font-weight:700; align-self:center; margin-right:2px; white-space:nowrap; }
#tags button.qty { min-width:34px; font-family:var(--mono); }
#tags button.qty.on { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:800; }
#ctl {
  display:grid; grid-template-columns:.95fr .95fr 1fr 1.15fr 1.55fr 1.55fr; gap:6px;
  padding:7px 8px; border-top:1px solid var(--line); background:var(--panel); flex:0 0 auto;
}
#ctl button { min-height:48px; font-size:14px; padding:0 4px; line-height:1.15; flex-direction:column; gap:1px; }
#ctl button small { display:block; font-family:var(--mono); font-size:10.5px; font-weight:700; opacity:.92; }
#nav {
  display:grid; grid-template-columns:1.55fr 1.35fr 1fr 1fr 1fr .9fr; gap:4px;
  padding:5px 6px 6px; border-top:1px solid var(--line); background:#0d131d; flex:0 0 auto;
}
#nav button {
  min-height:40px; border:0; background:transparent; color:var(--fg2);
  font-size:12.5px; font-weight:700; border-radius:var(--r); padding:2px; white-space:nowrap;
}

/* Sheets & modals */
.sheet {
  position:fixed; left:0; right:0; bottom:0; max-height:86dvh; overflow:auto;
  background:var(--panel); border-top:1px solid var(--line-hi);
  box-shadow:0 -12px 36px rgba(0,0,0,.6); border-radius:14px 14px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom)); display:none; z-index:45; font-size:14px;
  transition:transform .22s cubic-bezier(.2,.8,.3,1), opacity .18s ease; transform:translateY(22px); opacity:0;
}
.sheet.show { transform:none; opacity:1; }
.sheet h3 { margin:2px 0 12px; font-size:18px; font-weight:800; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.sheet h4 { margin:18px 0 8px; font-size:11px; font-weight:800; letter-spacing:.14em; color:var(--acc); border-top:1px solid var(--line-hi); padding-top:10px; text-transform:uppercase; }
.sheet .x { border:0; background:var(--card); font-size:20px; color:var(--fg2); width:32px; height:32px; border-radius:var(--r); flex:0 0 auto; }
.sheet .x:hover { background:var(--card2); color:var(--fg); }
.sheet > label { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.sheet select, .sheet input[type=number] {
  font-size:15px; padding:5px 8px; border:1px solid var(--line-hi); border-radius:var(--r);
  background:var(--bg); color:var(--fg); max-width:56%;
}
.sheet input[type=checkbox] { width:18px; height:18px; accent-color:var(--acc); }
.sheet table { border-collapse:collapse; width:100%; font-size:12.5px; font-variant-numeric:tabular-nums; }
.sheet th, .sheet td { border-bottom:1px solid var(--line); padding:6px 4px; text-align:right; white-space:nowrap; }
.sheet th { color:var(--muted); font-weight:700; font-size:11.5px; }
.sheet th:first-child, .sheet td:first-child { text-align:left; }
.note { color:var(--muted); font-size:12.5px; line-height:1.6; }
.btnrow { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.btnrow button { padding:9px 14px; border-radius:var(--r); border:1px solid var(--line-hi); background:var(--card); color:var(--fg); font-weight:600; }
.btnrow button:hover { background:var(--card2); }
.btnrow button.main { background:var(--acc); border-color:transparent; color:var(--acc-ink); font-weight:800; flex:1; min-height:42px; }
.btnrow button.exit { flex:1; min-height:42px; font-weight:800; border:2px solid var(--acc); background:var(--acc-dim); color:var(--acc); }
.sheet textarea { width:100%; min-height:88px; font:14px var(--mono); background:var(--bg); color:var(--fg); border:1px solid var(--line-hi); border-radius:var(--r); padding:8px; }
.kpi { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0; }
.kpi div { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:9px 10px; }

<script>
/* PWA offline cache & update prompt (only runs over http/https; safe alongside gold-trainer) */
(function () {
  var box = document.getElementById('ktPwa'), hideT = null;
  function show(html, ms, onclick) {
    box.innerHTML = html; box.style.display = 'block'; box.style.cursor = onclick ? 'pointer' : 'default'; box.onclick = onclick || null;

  if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') return;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }

  navigator.serviceWorker.addEventListener('controllerchange', function () { if (updating) location.reload(); });
  function offer(w) {
    show('\u6709\u65b0\u7248\u672c <span style="color:#38bdf8">\u00b7 \u70b9\u8fd9\u91cc\u66f4\u65b0</span>\uff08\u7ec3\u4e60\u8bb0\u5f55\u4f1a\u4fdd\u7559\uff09', 0, function () {
      if (window.__nqkt && window.__nqkt.pos && !window.__nqkt.pos.closed) {
        show('\u8bf7\u5148\u5e73\u4ed3\uff0c\u518d\u66f4\u65b0', 3000); setTimeout(function () { offer(w); }, 3200); return;

    if (!window.caches) return;

        });
